<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<meta name="robots" content="noindex, nofollow">
<title>Agendamento temporariamente indisponível · Levi Dos Cortes</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090909;color:#f5f3f2}
*{box-sizing:border-box}
body{min-height:100svh;margin:0;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(ellipse at 50% 12%,rgba(112,19,35,.19),transparent 48%),radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.035),transparent 45%),#090909}
main{width:min(100%,520px);padding:clamp(30px,7vw,54px) clamp(24px,7vw,56px);text-align:center;border:1px solid rgba(255,255,255,.105);border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));box-shadow:0 28px 90px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.mark{width:58px;height:58px;margin:0 auto 24px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.27);border-radius:50%;color:#fff;font-family:Georgia,serif;font-size:21px;letter-spacing:-2px}
.brand{margin:0 0 34px;color:rgba(255,255,255,.74);font-size:10px;font-weight:650;letter-spacing:.25em;text-transform:uppercase}
.symbol{width:38px;height:38px;margin:0 auto 22px;color:#d6b7bc}
.eyebrow{margin:0 0 12px;color:#c89ba3;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(29px,7vw,39px);font-weight:400;line-height:1.12;letter-spacing:-.035em}
.message{max-width:360px;margin:18px auto 0;color:rgba(245,243,242,.66);font-size:14px;line-height:1.8}
.rule{width:44px;height:1px;margin:30px auto 20px;background:rgba(200,155,163,.72)}
.footer{margin:0;color:rgba(255,255,255,.38);font-size:10px;letter-spacing:.13em;text-transform:uppercase}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">LC</div>
<p class="brand">Levi Dos Cortes</p>
<svg class="symbol" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect x="8" y="8" width="24" height="24" rx="12" stroke="currentColor" stroke-width="1.35"/><path d="M20 14v7m0 5h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
<p class="eyebrow">Aviso</p>
<h1>Agendamento temporariamente indisponível</h1>
<p class="message">No momento, a agenda online está pausada. Para informações sobre horários, entre em contato diretamente com a barbearia.</p>
<div class="rule"></div>
<p class="footer">Agradecemos a compreensão</p>
</main>
</body>
</html>
